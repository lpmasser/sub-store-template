name: Build client rule artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-rules.yml
      - rules/sources.json
      - scripts/build-rules.mjs

permissions:
  contents: read

concurrency:
  group: build-client-rules-${{ github.ref }}
  cancel-in-progress: false

env:
  SING_BOX_VERSION: 1.13.14
  SING_BOX_LINUX_AMD64_SHA256: f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          extract_dir="${RUNNER_TEMP}/sing-box"
          bin_dir="${RUNNER_TEMP}/bin"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --output "${archive_path}" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"

          printf '%s  %s\n' "${SING_BOX_LINUX_AMD64_SHA256}" "${archive_path}" | sha256sum --check --strict -

          mkdir -p "${extract_dir}" "${bin_dir}"
          tar -xzf "${archive_path}" --strip-components=1 -C "${extract_dir}"
          install -m 0755 "${extract_dir}/sing-box" "${bin_dir}/sing-box"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${bin_dir}/sing-box" version

      - name: Build rule artifacts
        shell: bash
        env:
          SING_BOX_BIN: sing-box
        run: |
          set -euo pipefail
          node scripts/build-rules.mjs

      - name: Commit updated artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git add -- rules/hagezi-pro.srs rules/shadowrocket rules/egern
          if git diff --cached --quiet; then
            echo "Rule artifacts are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): update generated client rules"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
